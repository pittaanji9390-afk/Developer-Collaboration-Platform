apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgehub-backend
  namespace: forgehub
  labels:
    app: forgehub-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: forgehub-backend
  template:
    metadata:
      labels:
        app: forgehub-backend
    spec:
      containers:
        - name: backend
          image: forgehub/backend:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: forgehub-config
            - secretRef:
                name: forgehub-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
