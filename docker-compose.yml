version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgehub
      POSTGRES_USER: forgehub
      POSTGRES_PASSWORD: forgehub_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgehub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: forgehub
      DB_USER: forgehub
      DB_PASSWORD: forgehub_secure_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VAULT_KEY: 635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E
    volumes:
      - gitdata:/app/data/git-repositories
      - uploaddata:/app/data/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
  gitdata:
  uploaddata:
